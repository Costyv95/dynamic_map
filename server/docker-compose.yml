version: '3.8'

services:
  map-processor:
    build: .
    container_name: map-processor
    volumes:
      # /data in the container is mapped to the LXC /data (which is the Samba share)
      - /data:/data
      # Mount the current directory into the app folder
      - .:/app
    working_dir: /app
    ports:
      - "5000:5000"
    restart: unless-stopped
