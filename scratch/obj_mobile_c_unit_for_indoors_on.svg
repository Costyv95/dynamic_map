<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3d6ea"/>
      <stop offset="1" stop-color="#6b8199"/>
    </linearGradient>
    <linearGradient id="grille" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5a78"/>
      <stop offset="1" stop-color="#28405c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f7ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- cool-air halo above the outlet -->
  <ellipse cx="64" cy="20" rx="34" ry="20" fill="url(#halo)"/>

  <!-- rising cool-air streams from the top outlet -->
  <g fill="none" stroke="url(#stream)" stroke-width="2.4" stroke-linecap="round">
    <path d="M55 26 C51 18 59 14 55 6"/>
    <path d="M64 26 C60 17 68 13 64 4"/>
    <path d="M73 26 C69 18 77 14 73 6"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="64" cy="114" rx="28" ry="4.5" fill="rgba(15,23,42,0.18)"/>

  <!-- main body -->
  <rect x="43" y="22" width="42" height="82" rx="9"
        fill="url(#body)" stroke="rgba(30,41,59,0.35)" stroke-width="2" stroke-linejoin="round"/>

  <!-- top outlet grille -->
  <rect x="49" y="27" width="30" height="15" rx="4" fill="url(#grille)"/>
  <rect x="52" y="30" width="24" height="1.8" rx="0.9" fill="#bae6fd"/>
  <rect x="52" y="33.5" width="24" height="1.8" rx="0.9" fill="#7dd3fc"/>
  <rect x="52" y="37" width="24" height="1.8" rx="0.9" fill="#38bdf8"/>

  <!-- control display (lit) -->
  <rect x="55" y="48" width="18" height="8" rx="2" fill="#0e2a3f"/>
  <circle cx="59" cy="52" r="1.8" fill="#5eead4"/>
  <circle cx="59" cy="52" r="3.2" fill="#5eead4" opacity="0.35"/>
  <rect x="63" y="50.5" width="7" height="3" rx="1.5" fill="#38bdf8"/>

  <!-- front intake louvers -->
  <rect x="50" y="63" width="28" height="3" rx="1.5" fill="#5f7086"/>
  <rect x="50" y="69" width="28" height="3" rx="1.5" fill="#59697e"/>
  <rect x="50" y="75" width="28" height="3" rx="1.5" fill="#526176"/>
  <rect x="50" y="81" width="28" height="3" rx="1.5" fill="#4c5a6d"/>
  <rect x="50" y="87" width="28" height="3" rx="1.5" fill="#465365"/>

  <!-- upper-left highlight -->
  <rect x="46" y="24" width="11" height="76" rx="6" fill="#ffffff" opacity="0.18"/>

  <!-- power indicator LED -->
  <circle cx="76" cy="99" r="2.2" fill="#4ade80"/>
  <circle cx="76" cy="99" r="3.6" fill="#4ade80" opacity="0.35"/>

  <!-- wheels / feet -->
  <ellipse cx="52" cy="104" rx="4" ry="4" fill="#2e3d52"/>
  <ellipse cx="76" cy="104" rx="4" ry="4" fill="#2e3d52"/>
</svg>
