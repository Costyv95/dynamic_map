<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="data:,">
    <title>Dynamic Map Editor</title>
    <link rel="stylesheet" href="editor.css?v=3.2.1">
    <script src="polybool.min.js"></script>
</head>
<body>
    <div id="dm-app" class="dm-app">
        <header id="toolbar" class="dm-toolbar"></header>
        <main id="canvas-container" class="dm-map"></main>
        <aside id="inspector" class="dm-inspector"></aside>
    </div>

    <!-- Shared datalists (populated at runtime) -->
    <datalist id="entityList"></datalist>
    <datalist id="iconList"></datalist>
    <datalist id="serviceList">
        <option value="light.turn_on">light.turn_on</option>
        <option value="light.turn_off">light.turn_off</option>
        <option value="light.toggle">light.toggle</option>
        <option value="switch.turn_on">switch.turn_on</option>
        <option value="switch.turn_off">switch.turn_off</option>
        <option value="switch.toggle">switch.toggle</option>
        <option value="script.turn_on">script.turn_on</option>
        <option value="scene.turn_on">scene.turn_on</option>
        <option value="fan.turn_on">fan.turn_on</option>
        <option value="fan.turn_off">fan.turn_off</option>
        <option value="cover.open_cover">cover.open_cover</option>
        <option value="cover.close_cover">cover.close_cover</option>
        <option value="cover.stop_cover">cover.stop_cover</option>
        <option value="climate.set_temperature">climate.set_temperature</option>
        <option value="media_player.media_play_pause">media_player.media_play_pause</option>
    </datalist>

    <script type="module" src="editor.js?v=3.2.1"></script>
</body>
</html>
