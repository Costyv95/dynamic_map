record_fingerprint:
  name: Record a map fingerprint
  description: Stand on a spot with the phone and record how far every Bluetooth proxy hears it, so the map can place that phone inside the room.
  fields:
    entity_id:
      name: Phone
      description: The phone's map-position sensor (sensor.<phone>_map_position).
      required: true
      selector:
        entity:
          integration: dynamic_map
          domain: sensor
    floor:
      name: Floor
      required: true
      selector:
        number: {min: 0, max: 20, mode: box}
    x:
      name: X (% of map width)
      required: true
      selector:
        number: {min: 0, max: 100, step: 0.1, mode: box}
    y:
      name: Y (% of map height)
      required: true
      selector:
        number: {min: 0, max: 100, step: 0.1, mode: box}
    seconds:
      name: Seconds
      default: 20
      selector:
        number: {min: 3, max: 60}
delete_fingerprint:
  name: Delete a map fingerprint
  description: Remove one recorded calibration spot.
  fields:
    id:
      name: Id
      required: true
      selector:
        text:
clear_fingerprints:
  name: Clear map fingerprints
  description: Remove recorded calibration spots, optionally only one floor or one room.
  fields:
    floor:
      name: Floor
      selector:
        number: {min: 0, max: 20, mode: box}
    room_id:
      name: Room id
      selector:
        text:
