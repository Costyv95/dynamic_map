record_fingerprint:
  name: Record a map fingerprint
  description: Stand on a spot with the phone and record how far every Bluetooth proxy hears it, so the map can place that phone inside the room.
  fields:
    entity_id:
      name: Phone
      description: The phone's map-position sensor (sensor.<phone>_map_position).
      required: true
      selector:
        entity:
          integration: dynamic_map
          domain: sensor
    floor:
      name: Floor
      required: true
      selector:
        number: {min: 0, max: 20, mode: box}
    x:
      name: X (% of map width)
      required: true
      selector:
        number: {min: 0, max: 100, step: 0.1, mode: box}
    y:
      name: Y (% of map height)
      required: true
      selector:
        number: {min: 0, max: 100, step: 0.1, mode: box}
    seconds:
      name: Seconds
      default: 20
      selector:
        number: {min: 3, max: 60}
delete_fingerprint:
  name: Delete a map fingerprint
  description: Remove one recorded calibration spot.
  fields:
    id:
      name: Id
      required: true
      selector:
        text:
clear_fingerprints:
  name: Clear map fingerprints
  description: Remove recorded calibration spots, optionally only one floor or one room.
  fields:
    floor:
      name: Floor
      selector:
        number: {min: 0, max: 20, mode: box}
    room_id:
      name: Room id
      selector:
        text:
save_vacuum_schedule:
  name: Save a vacuum schedule
  description: Add a cleaning schedule, or change one by its id (only the fields given change). Rooms empty means the whole house.
  fields:
    id:
      name: Id
      description: Leave out to add a new schedule.
      selector:
        text:
    name:
      name: Name
      selector:
        text:
    enabled:
      name: Enabled
      selector:
        boolean:
    entity_id:
      name: Vacuum
      selector:
        entity:
          domain: vacuum
    time:
      name: Time (HH:MM)
      example: "13:00"
      selector:
        text:
    days:
      name: Weekdays
      description: 0 = Monday … 6 = Sunday.
      example: "[0, 2, 4]"
      selector:
        object:
    rooms:
      name: Rooms
      description: Robot room names; empty cleans the whole house.
      selector:
        object:
    mode:
      name: Mode
      selector:
        select:
          options: [vac_mop, vacuum, mop]
    suction:
      name: Suction (fan speed)
      selector:
        text:
    water:
      name: Water (mop intensity)
      selector:
        text:
    route:
      name: Route (mop mode)
      selector:
        text:
    repeat:
      name: Passes
      selector:
        number: {min: 1, max: 3}
delete_vacuum_schedule:
  name: Delete a vacuum schedule
  fields:
    id:
      name: Id
      required: true
      selector:
        text:
run_vacuum_schedule:
  name: Run a vacuum schedule now
  fields:
    id:
      name: Id
      required: true
      selector:
        text:
